<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>恋狗窝 · 网页版</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f0e3e6;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  #phone {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    background: linear-gradient(180deg,#FFE0E8 0%,#FFF1F4 45%,#FFF8F9 100%);
    position: relative;
    box-shadow: 0 0 40px rgba(0,0,0,.15);
    display: flex;
    flex-direction: column;
  }
  @media (min-width: 460px) {
    #phone { min-height: 92vh; margin-top: 4vh; border-radius: 32px; overflow: hidden; }
  }
  .page { flex: 1; overflow-y: auto; padding-bottom: 76px; animation: rise .35s ease-out both; }
  @keyframes rise { from { opacity:0; transform: translateY(14px);} to { opacity:1; transform:none;} }
  @keyframes pop { from { transform: scale(.92); opacity:0;} to { transform: scale(1); opacity:1;} }

  /* 顶栏 */
  .topbar {
    padding: 18px 18px 6px;
    font-size: 17px; font-weight: bold; color:#333;
    display:flex; align-items:center; justify-content:space-between;
  }
  .topbar .back { cursor:pointer; color:#ff6b81; font-size:22px; line-height:1; }
  .code-pill {
    font-size: 12px; background:#fff; color:#ff6b81; font-weight:bold;
    border-radius: 20px; padding: 4px 12px; cursor:pointer;
    box-shadow: 0 2px 8px rgba(255,107,129,.25);
  }

  /* 卡片 */
  .card {
    background:#fff; border-radius:16px; margin: 0 14px 14px;
    padding: 16px; box-shadow: 0 4px 16px rgba(255,107,129,.08);
    transition: transform .15s ease;
  }
  .card:active { transform: scale(.985); }
  .card-tag { font-size: 12px; color:#ff6b81; margin-bottom: 8px; }
  .card-title { font-size: 16px; font-weight: bold; color:#333; line-height:1.5; }
  .card-sub { font-size: 13px; color:#999; margin-top: 6px; line-height:1.6; }

  .btn {
    display:inline-block; border:none; cursor:pointer;
    background:#ff6b81; color:#fff; font-size:14px; font-weight:bold;
    border-radius: 22px; padding: 9px 22px;
    box-shadow: 0 4px 12px rgba(255,107,129,.35);
    transition: transform .15s ease;
  }
  .btn:active { transform: scale(.94); }
  .btn.ghost { background:#f4f5f7; color:#909399; box-shadow:none; }
  .btn.big { width: 100%; padding: 12px; font-size: 15px; }

  input, textarea {
    width: 100%; border:none; outline:none; background:#f7f8fa;
    border-radius: 12px; padding: 12px 14px; font-size: 14px; color:#333;
    font-family: inherit;
  }
  textarea { resize: none; min-height: 90px; }
  input[type=date] { color:#333; }

  /* 首页 */
  .hero {
    display:flex; flex-direction:column; align-items:center;
    padding: 8px 0 4px; text-align:center;
  }
  .hero .dog { font-size: 54px; }
  .hero .days { font-size: 30px; font-weight: bold; color:#ff6b81; }
  .hero .days small { font-size: 13px; color:#999; font-weight: normal; }
  .quick {
    display:flex; background:#fff; border-radius:16px;
    margin: 10px 14px 14px; padding: 14px 0;
    box-shadow: 0 4px 16px rgba(255,107,129,.08);
  }
  .quick div { flex:1; text-align:center; cursor:pointer; font-size: 13px; color:#333; }
  .quick div:active { opacity:.6; }
  .quick .e { font-size: 26px; display:block; margin-bottom: 4px; }

  /* 空状态 */
  .empty { text-align:center; padding: 30px 0 10px; color:#bbb; font-size: 13px; }

  /* 动态 */
  .feed-item { border-bottom: 1px solid #fff2f4; padding: 12px 2px; }
  .feed-item:last-child { border-bottom: none; }
  .feed-time { font-size: 11px; color:#c4c7cf; margin-bottom: 4px; }
  .feed-content { font-size: 14px; color:#333; line-height:1.6; word-break:break-all; }

  /* 回忆时间线 */
  .stats {
    display:flex; background: linear-gradient(135deg,#ff6b81,#ff9a9e);
    border-radius: 16px; margin: 4px 14px 12px; padding: 14px 4px;
    box-shadow: 0 6px 18px rgba(255,107,129,.28); color:#fff;
  }
  .stats div { flex:1; text-align:center; }
  .stats b { font-size: 20px; display:block; }
  .stats span { font-size: 11px; opacity:.92; }
  .chips { white-space: nowrap; overflow-x:auto; padding: 2px 14px 8px; }
  .chip {
    display:inline-block; background:#fff; color:#666; font-size: 13px;
    border-radius: 18px; padding: 6px 16px; margin-right: 8px; cursor:pointer;
    transition: all .2s ease;
  }
  .chip.on { background:#ff6b81; color:#fff; font-weight:bold; }
  .tl-item { position:relative; margin-left: 26px; padding-left: 16px; padding-bottom: 14px; border-left: 2px solid #ffd3da; }
  .tl-dot { position:absolute; left:-7px; top:4px; width:12px; height:12px; border-radius:50%; background:#ff9a9e; border:2px solid #fff; }
  .tl-date { font-size: 11px; color:#c4c7cf; }
  .tl-card { background:#fff; border-radius: 12px; padding: 12px 14px; margin-top: 4px; box-shadow: 0 2px 10px rgba(255,107,129,.07); }
  .tl-title { font-size: 14px; font-weight: bold; color:#333; }

  /* 清单 */
  .check-item {
    display:flex; align-items:center; background:#fff; border-radius: 12px;
    margin: 0 14px 10px; padding: 13px 14px;
  }
  .check-item.done { opacity: .5; }
  .check-item.done .ct { text-decoration: line-through; }
  .circle {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid #dcdfe6;
    margin-right: 12px; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff;
  }
  .circle.on { background:#ff6b81; border-color:#ff6b81; }
  .ct { flex:1; font-size: 14px; color:#333; }
  .del { color:#dcdfe6; cursor:pointer; padding: 0 4px; font-size: 15px; }
  .del:hover { color:#ff6b81; }
  .addbar {
    position: fixed; bottom: 62px; left:50%; transform: translateX(-50%);
    width: 100%; max-width: 420px; background:#fff;
    display:flex; gap:10px; padding: 10px 14px; box-shadow: 0 -4px 14px rgba(0,0,0,.05);
  }
  .addbar input { flex:1; }

  /* 计划 */
  .plan-item { background:#fff; border-radius: 14px; margin: 0 14px 12px; padding: 14px; }
  .plan-item .pt { font-size: 15px; font-weight: bold; color:#333; }
  .plan-item .pd { font-size: 13px; color:#999; margin-top: 6px; }
  .plan-actions { margin-top: 10px; display:flex; gap: 10px; }

  /* 我的 */
  .mine-head { display:flex; flex-direction:column; align-items:center; padding: 10px 0 20px; }
  .mine-avatar {
    width: 84px; height: 84px; border-radius: 50%; background:#fff;
    box-shadow: 0 8px 24px rgba(255,107,129,.3);
    display:flex; align-items:center; justify-content:center;
    font-size: 40px; overflow:hidden; cursor:pointer;
  }
  .mine-avatar img { width:100%; height:100%; object-fit:cover; }
  .mine-name { font-size: 19px; font-weight: bold; color:#333; margin-top: 12px; }
  .field { display:flex; align-items:center; background:#fff; border-radius: 14px; margin: 0 14px 10px; padding: 4px 14px; }
  .field label { width: 76px; font-size: 14px; color:#666; flex-shrink:0; }
  .field input { background: transparent; padding: 12px 0; }
  .menu { background:#fff; border-radius: 16px; margin: 4px 14px; padding: 4px 16px; }
  .menu-item {
    display:flex; align-items:center; padding: 15px 2px;
    border-bottom: 1px solid #fff2f4; cursor:pointer; font-size: 15px; color:#333;
  }
  .menu-item:last-child { border-bottom:none; }
  .menu-item .e { width: 34px; }
  .menu-item .arr { margin-left:auto; color:#e3b2bc; font-size: 20px; }

  /* 底部导航 */
  .tabbar {
    position: fixed; bottom: 0; left:50%; transform: translateX(-50%);
    width: 100%; max-width: 420px; background:#fff;
    display:flex; border-top: 1px solid #f0f0f0; z-index: 50;
  }
  .tabbar div {
    flex:1; text-align:center; padding: 8px 0 10px; cursor:pointer;
    font-size: 11px; color:#999;
  }
  .tabbar div .e { font-size: 22px; display:block; margin-bottom: 2px; filter: grayscale(1) opacity(.6); }
  .tabbar div.on { color:#ff6b81; font-weight: bold; }
  .tabbar div.on .e { filter:none; }

  /* 引导页 */
  .onb { display:flex; flex-direction:column; align-items:center; padding-top: 60px; }
  .onb .dog { font-size: 70px; }
  .onb h1 { font-size: 24px; color:#333; margin: 10px 0 6px; }
  .onb p { font-size: 13px; color:#999; }
  .onb .card { width: calc(100% - 28px); margin-top: 30px; }
  .onb label { display:block; font-size: 12px; color:#999; margin: 14px 0 6px; }
  .hidden { display:none !important; }
  .tip-ok { color:#fff; text-align:center; font-size:12px; margin-top:8px; opacity:.9; }
</style>
</head>
<body>
<div id="phone">
  <!-- 引导页 -->
  <div id="v-onb" class="page onb hidden">
    <div class="dog">🐶</div>
    <h1>恋狗窝</h1>
    <p>一个只属于你们两个人的空间 · 网页版</p>
    <div class="card" style="width:calc(100% - 28px); align-self:center;">
      <label>你的昵称</label>
      <input id="onb-name" placeholder="对方将看到这个昵称">
      <label>你们在一起的日子</label>
      <input id="onb-date" type="date">
      <div style="margin-top:22px">
        <button class="btn big" onclick="onbDone()">开始使用</button>
      </div>
      <div class="tip-ok" id="onb-code"></div>
    </div>
  </div>

  <!-- 首页(动态) -->
  <div id="v-home" class="page hidden">
    <div class="topbar"><span>恋狗窝</span><span class="code-pill" onclick="copyCode()" title="点击复制邀请码">💌 <span id="tb-code"></span></span></div>
    <div class="hero">
      <div class="dog">🐶</div>
      <div class="days"><span id="h-days">0</span> <small>在一起的天数</small></div>
    </div>
    <div class="quick">
      <div onclick="go('check')"><span class="e">📅</span>约会计划</div>
      <div onclick="go('check')"><span class="e">✅</span>情侣清单</div>
      <div onclick="go('memories')"><span class="e">💗</span>纪念日</div>
    </div>
    <div class="card" id="h-tip-card">
      <div class="card-tag">💡 今日份小事</div>
      <div class="card-title" id="h-tip-title"></div>
      <div style="margin-top:12px; display:flex; gap:10px;">
        <button class="btn ghost" onclick="event.stopPropagation();refreshTip()">换一个</button>
        <button class="btn" onclick="go('check')">去打卡 →</button>
      </div>
    </div>
    <div class="card" id="h-plan-card" onclick="go('plans')">
      <div class="card-tag">💗 下一场约会</div>
      <div class="card-title" id="h-plan-title"></div>
      <div class="card-sub" id="h-plan-sub"></div>
    </div>
    <div class="card" id="h-feed-card">
      <div class="card-tag">📝 我们的动态</div>
      <textarea id="feed-input" placeholder="这一刻的想法..."></textarea>
      <div style="margin-top:10px; text-align:right;">
        <button class="btn" onclick="postFeed()">发表</button>
      </div>
      <div id="h-feed-list" style="margin-top:8px;"></div>
    </div>
  </div>

  <!-- 回忆 -->
  <div id="v-memories" class="page hidden">
    <div class="topbar"><span>我们的回忆</span></div>
    <div class="stats">
      <div><b id="s-days">0</b><span>在一起/天</span></div>
      <div><b id="s-check">0</b><span>完成小事</span></div>
      <div><b id="s-plan">0</b><span>完成约会</span></div>
      <div><b id="s-post">0</b><span>动态</span></div>
    </div>
    <div class="chips" id="mem-chips">
      <span class="chip on" data-f="all" onclick="memFilter('all',this)">全部</span>
      <span class="chip" data-f="check" onclick="memFilter('check',this)">小事</span>
      <span class="chip" data-f="plan" onclick="memFilter('plan',this)">约会</span>
      <span class="chip" data-f="article" onclick="memFilter('article',this)">日记</span>
    </div>
    <div id="mem-list"></div>
    <div class="empty" id="mem-empty" style="display:none">🐶 这里还很空,去创造第一段回忆吧</div>
  </div>

  <!-- 我的 -->
  <div id="v-mine" class="page hidden">
    <div class="mine-head">
      <div class="mine-avatar" id="m-avatar" onclick="document.getElementById('av-file').click()">🐶</div>
      <input type="file" id="av-file" accept="image/*" style="display:none" onchange="setAvatar(this)">
      <div class="mine-name" id="m-name"></div>
    </div>
    <div class="field"><label>昵称</label><input id="f-nick"></div>
    <div class="field"><label>在一起从</label><input id="f-start" type="date"></div>
    <div class="field"><label>手机号</label><input id="f-phone" type="tel" maxlength="11" placeholder="点击绑定手机号"></div>
    <div style="margin:4px 14px 14px; text-align:right;">
      <button class="btn" onclick="saveMine()">保存资料</button>
    </div>
    <div class="menu">
      <div class="menu-item" onclick="copyCode()"><span class="e">💌</span>我的邀请码 <span class="arr">›</span></div>
      <div class="menu-item" onclick="exportData()"><span class="e">📦</span>导出数据(JSON)<span class="arr">›</span></div>
      <div class="menu-item" onclick="clearAll()"><span class="e">🧹</span>清除全部数据<span class="arr">›</span></div>
    </div>
    <div style="text-align:center; font-size:11px; color:#d8aeb6; padding: 6px 0 20px;">恋狗窝 · 网页体验版(数据存于本浏览器)</div>
  </div>

  <!-- 清单页 -->
  <div id="v-check" class="page hidden">
    <div class="topbar"><span class="back" onclick="go('home')">‹</span><span>情侣清单</span><span></span></div>
    <div class="stats"><div><b id="c-done">0</b><span>已完成</span></div><div><b id="c-total">0</b><span>全部</span></div></div>
    <div id="c-list"></div>
    <div class="card" id="c-template" style="text-align:center;">
      <div style="font-size:34px;">📝</div>
      <div class="card-title" style="margin-top:6px;">导入「一起做的N件事」模板</div>
      <div class="card-sub">60 件小事,一键开始</div>
      <div style="margin-top:12px;"><button class="btn" onclick="importTemplate()">导入恋爱清单模板</button></div>
    </div>
    <div class="addbar">
      <input id="c-new" placeholder="添加一件想一起做的小事" onkeydown="if(event.key=='Enter')addCheck()">
      <button class="btn" onclick="addCheck()">添加</button>
    </div>
  </div>

  <!-- 计划页 -->
  <div id="v-plans" class="page hidden">
    <div class="topbar"><span class="back" onclick="go('home')">‹</span><span>约会计划板</span><span></span></div>
    <div class="card">
      <div class="card-tag">💌 发起一次约会</div>
      <input id="p-title" placeholder="比如:一起去看海" style="margin-bottom:10px;">
      <input id="p-date" type="date" style="margin-bottom:10px;">
      <input id="p-place" placeholder="地点(选填)" style="margin-bottom:10px;">
      <button class="btn big" onclick="addPlan()">发出提议(网页版单人演示将直接约定)</button>
    </div>
    <div id="p-list"></div>
  </div>

  <!-- 底部导航 -->
  <div class="tabbar" id="tabbar">
    <div data-v="home" class="on" onclick="go('home')"><span class="e">🐶</span>动态</div>
    <div data-v="memories" onclick="go('memories')"><span class="e">📷</span>回忆</div>
    <div data-v="mine" onclick="go('mine')"><span class="e">💗</span>我的</div>
  </div>
</div>

<script>
// ============ 数据层(localStorage) ============
const KEY = 'lgw_v1';
let store = load();
function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch(e) { return null; }
}
function save() { localStorage.setItem(KEY, JSON.stringify(store)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function genCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = ''; for (let i=0;i<6;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}
function fmt(ts) {
  const d = new Date(ts);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function daysSince(ts) {
  const a = new Date(ts); a.setHours(0,0,0,0);
  const b = new Date(); b.setHours(0,0,0,0);
  return Math.max(Math.round((b - a) / 86400000), 1);
}

// ============ 模板 ============
const TEMPLATE = ['一起看一场日出','一起看一次日落','一起去看海','一起去看雪','一起爬山看云海','一起露营看星星','一起放一次烟花','一起去看一场演唱会','一起看一场电影首映','一起通宵看完一部剧','一起逛深夜的便利店','一起做一顿完整的晚餐','一起烤一次蛋糕','一起吃自助餐吃到扶墙出','一起打卡对方家乡的美食','一起吃一次路边摊','一起逛菜市场买菜','一起养一只宠物','一起种一盆植物并养活它','一起拼完一幅1000片拼图','一起玩一次密室逃脱','一起玩一次剧本杀','一起在游乐园坐摩天轮','一起坐一次过山车','一起手拉手进一次鬼屋','一起逛一次美术馆','一起逛一次博物馆','一起听一场音乐会','一起看一次话剧','一起看一次流星雨','一起骑车穿过一座城市','一起坐一次凌晨的火车','一起坐一次热气球','一起去看一次极光','一起泡一次温泉','一起在海边捡贝壳','一起放一次风筝','一起划一次船','一起在冬天吃热乎乎的糖炒栗子','一起淋一场雨然后马上回家','一起打一场雪仗','一起堆一个雪人','一起给对方做一次早餐','一起坚持运动21天','一起完成一次徒步','一起拍一卷胶片','一起拍一次情侣写真','一起录一段搞怪视频','一起给未来的自己写信','一起存一笔梦想基金','一起完成一次说走就走的旅行','一起去对方的城市旅行','一起回对方的母校看看','一起见彼此的好朋友','一起回家过一次年','一起布置一个共同的家','一起逛宜家假装在自己的家','一起跨年倒数','一起过一次只属于我们的情人节','一起教会对方一项新技能'];

// ============ 路由 ============
function go(v) {
  ['onb','home','memories','mine','check','plans'].forEach(id => {
    document.getElementById('v-' + id).classList.toggle('hidden', id !== v);
  });
  document.querySelectorAll('.tabbar div').forEach(t => {
    t.classList.toggle('on', t.dataset.v === v);
  });
  const tabPages = { home:1, memories:1, mine:1 };
  document.getElementById('tabbar').style.display = tabPages[v] ? 'flex' : 'none';
  window.scrollTo(0,0);
  if (v === 'home') renderHome();
  if (v === 'memories') renderMemories();
  if (v === 'mine') renderMine();
  if (v === 'check') renderCheck();
  if (v === 'plans') renderPlans();
}

// ============ 引导 ============
function onbDone() {
  const name = document.getElementById('onb-name').value.trim();
  const date = document.getElementById('onb-date').value;
  if (!name) return alert('先给自己起个昵称吧');
  if (!date) return alert('请选择你们在一起的日子');
  store.profile = { nickname: name, avatar: '', phone: '', startDate: date };
  store.inviteCode = genCode();
  save();
  document.getElementById('onb-code').textContent = '💌 你的邀请码:' + store.inviteCode + '(已复制,可在"我的"页再次复制)';
  try { navigator.clipboard.writeText(store.inviteCode); } catch(e) {}
  setTimeout(() => go('home'), 1200);
}

// ============ 首页 ============
function renderHome() {
  document.getElementById('tb-code').textContent = store.inviteCode || '';
  const start = new Date(store.profile.startDate).getTime();
  document.getElementById('h-days').textContent = daysSince(start);
  // 今日份小事
  const undone = store.checklist.filter(i => !i.done);
  const tipCard = document.getElementById('h-tip-card');
  if (undone.length) {
    tipCard.style.display = 'block';
    if (!window._tip || !undone.find(i => i.id === window._tip.id)) {
      window._tip = undone[Math.floor(Math.random() * undone.length)];
    }
    document.getElementById('h-tip-title').textContent = '「' + window._tip.title + '」';
  } else if (store.checklist.length) {
    tipCard.style.display = 'block';
    document.getElementById('h-tip-title').textContent = '全部小事都打卡完成啦 🎉';
  } else {
    tipCard.style.display = 'block';
    document.getElementById('h-tip-title').textContent = '从 100 件小事里,挑一件今天做';
  }
  // 下一场约会
  const planCard = document.getElementById('h-plan-card');
  const next = store.plans.filter(p => p.status === 'accepted').sort((a,b) => a.date < b.date ? -1 : 1)[0];
  if (next) {
    planCard.style.display = 'block';
    document.getElementById('h-plan-title').textContent = '💗 距离「' + next.title + '」还有 ' + Math.max(Math.ceil((new Date(next.date) - new Date())/86400000), 0) + ' 天';
    document.getElementById('h-plan-sub').textContent = fmt(new Date(next.date)) + (next.place ? ' · ' + next.place : '');
  } else {
    planCard.style.display = 'block';
    document.getElementById('h-plan-title').textContent = '💌 还没有约定好的约会';
    document.getElementById('h-plan-sub').textContent = '这周末,给 Ta 一个突然袭击?';
  }
  renderFeed();
}
function refreshTip() {
  window._tip = null;
  renderHome();
}
function postFeed() {
  const input = document.getElementById('feed-input');
  const content = input.value.trim();
  if (!content) return alert('先写点什么吧');
  store.articles.unshift({ id: uid(), content, time: Date.now() });
  save(); input.value = '';
  renderFeed();
}
function renderFeed() {
  const el = document.getElementById('h-feed-list');
  el.innerHTML = store.articles.map(a =>
    '<div class="feed-item"><div class="feed-time">' + fmt(a.time) + '</div><div class="feed-content">' + esc(a.content) + '</div></div>'
  ).join('') || '<div class="empty">还没有第一条动态,从今天的日落开始</div>';
}

// ============ 回忆 ============
let memFilterKey = 'all';
function memFilter(f, el) {
  memFilterKey = f;
  document.querySelectorAll('#mem-chips .chip').forEach(c => c.classList.toggle('on', c.dataset.f === f));
  renderMemories();
}
function renderMemories() {
  const start = new Date(store.profile.startDate).getTime();
  document.getElementById('s-days').textContent = daysSince(start);
  document.getElementById('s-check').textContent = store.checklist.filter(i => i.done).length;
  document.getElementById('s-plan').textContent = store.plans.filter(p => p.status === 'done').length;
  document.getElementById('s-post').textContent = store.articles.length;
  let events = [{
    type: 'love', time: start, date: fmt(start),
    title: '🐶 我们在一起啦', sub: '故事从这里开始'
  }];
  store.checklist.filter(i => i.done).forEach(i => {
    events.push({ type:'check', time: i.doneTime, date: fmt(i.doneTime), title: '✅ 打卡了「' + i.title + '」', sub: '' });
  });
  store.plans.filter(p => p.status === 'done').forEach(p => {
    events.push({ type:'plan', time: p.doneTime, date: fmt(p.doneTime), title: '💗 完成了约会「' + p.title + '」', sub: p.place || '' });
  });
  store.articles.forEach(a => {
    events.push({ type:'article', time: a.time, date: fmt(a.time), title: '📝 写下了一条动态', sub: a.content.slice(0, 40) });
  });
  events.sort((a,b) => b.time - a.time);
  const visible = memFilterKey === 'all' ? events : events.filter(e => e.type === memFilterKey);
  document.getElementById('mem-list').innerHTML = visible.map(e =>
    '<div class="tl-item"><div class="tl-dot"></div><div class="tl-date">' + e.date + '</div><div class="tl-card"><div class="tl-title">' + e.title + '</div>' + (e.sub ? '<div class="tl-sub">' + esc(e.sub) + '</div>' : '') + '</div></div>'
  ).join('') + '<div class="empty">── 已经翻到最早的回忆啦 ──</div>';
  document.getElementById('mem-empty').style.display = visible.length ? 'none' : 'block';
}

// ============ 清单 ============
function renderCheck() {
  const undone = store.checklist.filter(i => !i.done);
  const done = store.checklist.filter(i => i.done).reverse();
  const items = undone.concat(done);
  document.getElementById('c-done').textContent = done.length;
  document.getElementById('c-total').textContent = store.checklist.length;
  document.getElementById('c-list').innerHTML = items.map(i =>
    '<div class="check-item ' + (i.done ? 'done' : '') + '"><div class="circle ' + (i.done ? 'on' : '') + '" onclick="toggleCheck(\'' + i.id + '\')">' + (i.done ? '✓' : '') + '</div><div class="ct">' + esc(i.title) + '</div><div class="del" onclick="delCheck(\'' + i.id + '\')">✕</div></div>'
  ).join('');
  document.getElementById('c-template').style.display = store.checklist.length ? 'none' : 'block';
}
function addCheck() {
  const input = document.getElementById('c-new');
  const title = input.value.trim();
  if (!title) return alert('先写下一件想一起做的事吧');
  store.checklist.push({ id: uid(), title, done: false });
  save(); input.value = ''; renderCheck();
}
function toggleCheck(id) {
  const item = store.checklist.find(i => i.id === id);
  if (item.done) { item.done = false; item.doneTime = null; }
  else { item.done = true; item.doneTime = Date.now(); }
  save(); renderCheck();
}
function delCheck(id) {
  if (!confirm('删除这件小事吗?删除后无法恢复')) return;
  store.checklist = store.checklist.filter(i => i.id !== id);
  save(); renderCheck();
}
function importTemplate() {
  const existing = {};
  store.checklist.forEach(i => existing[i.title] = true);
  let n = 0;
  TEMPLATE.forEach(t => {
    if (!existing[t]) { store.checklist.push({ id: uid(), title: t, done: false }); n++; }
  });
  save(); renderCheck();
  alert('已导入 ' + n + ' 件小事,开始打卡吧!');
}

// ============ 计划 ============
function renderPlans() {
  const order = { accepted: 0, done: 1 };
  const list = store.plans.slice().sort((a,b) => (order[a.status] - order[b.status]) || (a.date < b.date ? -1 : 1));
  document.getElementById('p-list').innerHTML = list.map(p => {
    let actions = '';
    if (p.status === 'accepted') actions = '<div class="plan-actions"><button class="btn" onclick="donePlan(\'' + p.id + '\')">标记完成</button></div>';
    if (p.status === 'done') actions = '<div class="pd">💗 完成于 ' + fmt(p.doneTime) + '</div>';
    return '<div class="plan-item"><div class="pt">' + esc(p.title) + '</div><div class="pd">' + p.date + (p.place ? ' · ' + esc(p.place) : '') + (p.status === 'accepted' ? ' · 已约定' : '') + '</div>' + actions + '</div>';
  }).join('') || '<div class="empty">💌 还没有约定,发起一次约会吧</div>';
}
function addPlan() {
  const title = document.getElementById('p-title').value.trim();
  const date = document.getElementById('p-date').value;
  const place = document.getElementById('p-place').value.trim();
  if (!title) return alert('给这次约会起个名字吧');
  if (!date) return alert('请选择约会日期');
  store.plans.push({ id: uid(), title, date, place, status: 'accepted' });
  save(); renderPlans();
}
function donePlan(id) {
  const p = store.plans.find(x => x.id === id);
  p.status = 'done'; p.doneTime = Date.now();
  save(); renderPlans();
}

// ============ 我的 ============
function renderMine() {
  document.getElementById('m-name').textContent = store.profile.nickname || '';
  document.getElementById('m-avatar').innerHTML = store.profile.avatar ? '<img src="' + store.profile.avatar + '">' : '🐶';
  document.getElementById('f-nick').value = store.profile.nickname || '';
  document.getElementById('f-start').value = store.profile.startDate || '';
  document.getElementById('f-phone').value = store.profile.phone || '';
}
function setAvatar(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    store.profile.avatar = e.target.result;
    save(); renderMine();
  };
  reader.readAsDataURL(file);
}
function saveMine() {
  const nick = document.getElementById('f-nick').value.trim();
  const start = document.getElementById('f-start').value;
  const phone = document.getElementById('f-phone').value.trim();
  if (nick) store.profile.nickname = nick;
  if (start) store.profile.startDate = start;
  store.profile.phone = phone;
  save(); renderMine(); alert('资料已保存');
}
function copyCode() {
  const code = store.inviteCode || '';
  try { navigator.clipboard.writeText(code); } catch(e) {}
  alert('邀请码已复制:' + code + '\n发给 Ta,在 Ta 的浏览器打开恋狗窝并输入即可(网页体验版数据存本地)');
}
function exportData() {
  const blob = new Blob([JSON.stringify(store, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'liangouwo-backup.json';
  a.click();
}
function clearAll() {
  if (!confirm('清除本浏览器的全部恋狗窝数据?')) return;
  localStorage.removeItem(KEY);
  location.reload();
}
function esc(s) { return String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ============ 启动 ============
if (!store || !store.profile || !store.profile.startDate) {
  document.getElementById('v-onb').classList.remove('hidden');
} else {
  go('home');
}
</script>
</body>
</html>
